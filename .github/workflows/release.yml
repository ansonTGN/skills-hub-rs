name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: windows-latest
            asset: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Require committed Cargo.lock
        shell: bash
        run: test -f Cargo.lock
      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Select stable
        run: rustup default 1.96.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Build release
        run: cargo build --release --locked

      - name: Linux smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/smoke-test.sh ./target/release/skills-hub-rs
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/package
          cp target/release/skills-hub-rs dist/skills-hub-rs-linux-x86_64
          chmod +x dist/skills-hub-rs-linux-x86_64
          cp dist/skills-hub-rs-linux-x86_64 dist/package/skills-hub-rs
          cp README.md LICENSE dist/package/
          tar -C dist/package -czf dist/skills-hub-rs-linux-x86_64.tar.gz .
          (cd dist && sha256sum skills-hub-rs-linux-x86_64 > skills-hub-rs-linux-x86_64.sha256)
          (cd dist && sha256sum skills-hub-rs-linux-x86_64.tar.gz > skills-hub-rs-linux-x86_64.tar.gz.sha256)

      - name: Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Bin .\target\release\skills-hub-rs.exe
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\package | Out-Null
          Copy-Item target\release\skills-hub-rs.exe dist\skills-hub-rs-windows-x86_64.exe
          Copy-Item dist\skills-hub-rs-windows-x86_64.exe dist\package\skills-hub-rs.exe
          Copy-Item README.md,LICENSE dist\package\
          Compress-Archive -Path dist\package\* -DestinationPath dist\skills-hub-rs-windows-x86_64.zip -Force
          $exeHash = (Get-FileHash dist\skills-hub-rs-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$exeHash  skills-hub-rs-windows-x86_64.exe" | Set-Content -NoNewline dist\skills-hub-rs-windows-x86_64.exe.sha256
          $zipHash = (Get-FileHash dist\skills-hub-rs-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  skills-hub-rs-windows-x86_64.zip" | Set-Content -NoNewline dist\skills-hub-rs-windows-x86_64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/skills-hub-rs-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          ls -lah dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Skills Hub Rust $TAG"
          fi
