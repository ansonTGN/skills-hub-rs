name: Release binaries

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'desktop/**'
      - 'scripts/**'

  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:

  # ============================================================
  # CLI
  # ============================================================

  build:
    name: CLI ${{ matrix.asset }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: windows-latest
            asset: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Require committed Cargo.lock
        shell: bash
        run: test -f Cargo.lock

      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy

      - name: Select Rust
        run: rustup default 1.96.0

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Linux smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/smoke-test.sh ./target/release/skills-hub-rs

      - name: Package Linux CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist/package

          cp target/release/skills-hub-rs \
            dist/skills-hub-rs-linux-x86_64

          chmod +x dist/skills-hub-rs-linux-x86_64

          cp dist/skills-hub-rs-linux-x86_64 \
            dist/package/skills-hub-rs

          cp README.md LICENSE dist/package/

          tar -C dist/package -czf \
            dist/skills-hub-rs-linux-x86_64.tar.gz .

          (
            cd dist
            sha256sum skills-hub-rs-linux-x86_64 \
              > skills-hub-rs-linux-x86_64.sha256

            sha256sum skills-hub-rs-linux-x86_64.tar.gz \
              > skills-hub-rs-linux-x86_64.tar.gz.sha256
          )

      - name: Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Bin .\target\release\skills-hub-rs.exe

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\package | Out-Null

          Copy-Item `
            target\release\skills-hub-rs.exe `
            dist\skills-hub-rs-windows-x86_64.exe

          Copy-Item `
            dist\skills-hub-rs-windows-x86_64.exe `
            dist\package\skills-hub-rs.exe

          Copy-Item README.md,LICENSE dist\package\

          Compress-Archive `
            -Path dist\package\* `
            -DestinationPath dist\skills-hub-rs-windows-x86_64.zip `
            -Force

          $exeHash = (
            Get-FileHash `
              dist\skills-hub-rs-windows-x86_64.exe `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$exeHash  skills-hub-rs-windows-x86_64.exe" |
            Set-Content -NoNewline `
              dist\skills-hub-rs-windows-x86_64.exe.sha256

          $zipHash = (
            Get-FileHash `
              dist\skills-hub-rs-windows-x86_64.zip `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$zipHash  skills-hub-rs-windows-x86_64.zip" |
            Set-Content -NoNewline `
              dist\skills-hub-rs-windows-x86_64.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.asset }}
          path: dist/skills-hub-rs-*
          if-no-files-found: error


  # ============================================================
  # DESKTOP / TAURI
  # ============================================================

  desktop:
    name: Desktop ${{ matrix.asset }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64

          - os: windows-latest
            asset: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # ----------------------------------------------------------
      # Linux dependencies
      # ----------------------------------------------------------

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail

          APT_UBUNTU=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o APT::Get::List-Cleanup=0
          )

          sudo apt-get "${APT_UBUNTU[@]}" update

          sudo apt-get "${APT_UBUNTU[@]}" install \
            -y \
            --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      # ----------------------------------------------------------
      # Rust + Tauri CLI
      # ----------------------------------------------------------

      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy

      - name: Select Rust
        run: rustup default 1.96.0

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Tauri version
        run: cargo tauri --version

      - name: Require desktop Cargo.lock
        shell: bash
        run: test -f desktop/src-tauri/Cargo.lock

      - name: Format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check

      - name: Check
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked

      - name: Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings


      # ----------------------------------------------------------
      # Linux bundles
      # ----------------------------------------------------------

      - name: Build Linux Desktop bundles
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -euxo pipefail
          cargo tauri build --bundles deb,appimage

      - name: Package Linux Desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          DEB="$(
            find desktop/src-tauri/target/release/bundle/deb \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              | head -1
          )"

          APPIMAGE="$(
            find desktop/src-tauri/target/release/bundle/appimage \
              -maxdepth 1 \
              -type f \
              -name '*.AppImage' \
              | head -1
          )"

          test -n "$DEB"
          test -n "$APPIMAGE"

          cp "$DEB" \
            dist/skills-hub-rs-desktop-linux-x86_64.deb

          cp "$APPIMAGE" \
            dist/skills-hub-rs-desktop-linux-x86_64.AppImage

          chmod +x \
            dist/skills-hub-rs-desktop-linux-x86_64.AppImage

          (
            cd dist

            sha256sum \
              skills-hub-rs-desktop-linux-x86_64.deb \
              > skills-hub-rs-desktop-linux-x86_64.deb.sha256

            sha256sum \
              skills-hub-rs-desktop-linux-x86_64.AppImage \
              > skills-hub-rs-desktop-linux-x86_64.AppImage.sha256
          )


      # ----------------------------------------------------------
      # Windows NSIS
      # ----------------------------------------------------------

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          cargo tauri build --bundles nsis


      # ----------------------------------------------------------
      # Windows MSI
      #
      # WiX accepts only a numeric prerelease identifier.
      #
      # Examples:
      #   0.2.0-alpha.1 -> 0.2.0-1
      #   0.2.0-alpha.2 -> 0.2.0-2
      #   0.2.0         -> 0.2.0
      #
      # Unsupported prerelease schemes fail closed.
      # ----------------------------------------------------------

      - name: Create MSI version override
        if: runner.os == 'Windows'
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          $config = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $publicVersion = [string]$config.version

          if ($publicVersion -match '^(\d+\.\d+\.\d+)$') {
            $msiVersion = $publicVersion
          }
          elseif ($publicVersion -match '^(\d+\.\d+\.\d+)-alpha\.(\d+)$') {
            $msiVersion = "$($Matches[1])-$($Matches[2])"
          }
          else {
            throw "Unsupported MSI version mapping: $publicVersion"
          }

          @{
            version = $msiVersion
          } |
            ConvertTo-Json |
            Set-Content -Encoding UTF8 tauri.msi.conf.json

          Write-Host "Public version: $publicVersion"
          Write-Host "MSI version:    $msiVersion"

      - name: Build Windows MSI installer
        if: runner.os == 'Windows'
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          cargo tauri build `
            --bundles msi `
            --config tauri.msi.conf.json

      - name: Package Windows Desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $nsis = Get-ChildItem `
            desktop\src-tauri\target\release\bundle\nsis\*.exe |
            Select-Object -First 1

          $msi = Get-ChildItem `
            desktop\src-tauri\target\release\bundle\msi\*.msi |
            Select-Object -First 1

          if (-not $nsis) {
            throw "NSIS installer not found"
          }

          if (-not $msi) {
            throw "MSI installer not found"
          }

          Copy-Item `
            $nsis.FullName `
            dist\skills-hub-rs-desktop-windows-x86_64-setup.exe

          Copy-Item `
            $msi.FullName `
            dist\skills-hub-rs-desktop-windows-x86_64.msi

          $exeHash = (
            Get-FileHash `
              dist\skills-hub-rs-desktop-windows-x86_64-setup.exe `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$exeHash  skills-hub-rs-desktop-windows-x86_64-setup.exe" |
            Set-Content -NoNewline `
              dist\skills-hub-rs-desktop-windows-x86_64-setup.exe.sha256

          $msiHash = (
            Get-FileHash `
              dist\skills-hub-rs-desktop-windows-x86_64.msi `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$msiHash  skills-hub-rs-desktop-windows-x86_64.msi" |
            Set-Content -NoNewline `
              dist\skills-hub-rs-desktop-windows-x86_64.msi.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.asset }}
          path: dist/skills-hub-rs-desktop-*
          if-no-files-found: error


  # ============================================================
  # SECURITY AUDIT + CYCLONEDX SBOM
  # ============================================================

  sbom:
    name: Security audit + CycloneDX SBOM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Select Rust
        run: rustup default 1.96.0

      - name: Install supply-chain tools
        shell: bash
        run: |
          set -euxo pipefail

          cargo install cargo-audit \
            --version 0.22.2 \
            --locked

          cargo install cargo-cyclonedx \
            --version 0.5.9 \
            --locked

      - name: Audit Rust dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cargo audit --deny yanked

          cargo audit \
            --file desktop/src-tauri/Cargo.lock \
            --deny yanked

      - name: Generate CycloneDX 1.5 SBOMs
        shell: bash
        run: |
          set -euxo pipefail

          cargo cyclonedx \
            --manifest-path Cargo.toml \
            --format json \
            --spec-version 1.5 \
            --override-filename skills-hub-rs-sbom

          cargo cyclonedx \
            --manifest-path desktop/src-tauri/Cargo.toml \
            --format json \
            --spec-version 1.5 \
            --override-filename skills-hub-rs-desktop-sbom

          mkdir -p dist

          mv \
            skills-hub-rs-sbom.json \
            dist/skills-hub-rs-sbom.cdx.json

          mv \
            desktop/src-tauri/skills-hub-rs-desktop-sbom.json \
            dist/skills-hub-rs-desktop-sbom.cdx.json

      - name: Validate SBOMs
        shell: bash
        run: |
          set -euxo pipefail

          CORE_VERSION="$(
            cargo metadata \
              --no-deps \
              --format-version 1 |
            jq -r \
              '.packages[]
               | select(.name == "skills-hub-rs")
               | .version' |
            head -1
          )"

          DESKTOP_VERSION="$(
            cargo metadata \
              --manifest-path desktop/src-tauri/Cargo.toml \
              --no-deps \
              --format-version 1 |
            jq -r \
              '.packages[]
               | select(.name == "skills-hub-rs-desktop")
               | .version' |
            head -1
          )"

          test "$(
            jq -r '.bomFormat' \
              dist/skills-hub-rs-sbom.cdx.json
          )" = "CycloneDX"

          test "$(
            jq -r '.specVersion' \
              dist/skills-hub-rs-sbom.cdx.json
          )" = "1.5"

          test "$(
            jq -r '.metadata.component.version' \
              dist/skills-hub-rs-sbom.cdx.json
          )" = "$CORE_VERSION"

          test "$(
            jq -r '.bomFormat' \
              dist/skills-hub-rs-desktop-sbom.cdx.json
          )" = "CycloneDX"

          test "$(
            jq -r '.specVersion' \
              dist/skills-hub-rs-desktop-sbom.cdx.json
          )" = "1.5"

          test "$(
            jq -r '.metadata.component.version' \
              dist/skills-hub-rs-desktop-sbom.cdx.json
          )" = "$DESKTOP_VERSION"

      - name: Generate SBOM checksums
        shell: bash
        run: |
          set -euxo pipefail

          cd dist

          sha256sum \
            skills-hub-rs-sbom.cdx.json \
            > skills-hub-rs-sbom.cdx.json.sha256

          sha256sum \
            skills-hub-rs-desktop-sbom.cdx.json \
            > skills-hub-rs-desktop-sbom.cdx.json.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/*
          if-no-files-found: error


  # ============================================================
  # PUBLISH ONE GITHUB RELEASE
  # ============================================================

  publish:
    name: Publish GitHub Release

    needs:
      - build
      - desktop
      - sbom

    if: github.event_name != 'pull_request'

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show release artifacts
        shell: bash
        run: |
          find dist \
            -maxdepth 1 \
            -type f \
            -printf '%f\t%s bytes\n' \
            | sort

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/skills-hub-rs-linux-x86_64
            dist/skills-hub-rs-linux-x86_64.tar.gz
            dist/skills-hub-rs-windows-x86_64.exe
            dist/skills-hub-rs-windows-x86_64.zip
            dist/skills-hub-rs-desktop-linux-x86_64.deb
            dist/skills-hub-rs-desktop-linux-x86_64.AppImage
            dist/skills-hub-rs-desktop-windows-x86_64-setup.exe
            dist/skills-hub-rs-desktop-windows-x86_64.msi
            dist/skills-hub-rs-sbom.cdx.json
            dist/skills-hub-rs-desktop-sbom.cdx.json

      - name: Attest core Rust dependency SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/skills-hub-rs-linux-x86_64
            dist/skills-hub-rs-linux-x86_64.tar.gz
            dist/skills-hub-rs-windows-x86_64.exe
            dist/skills-hub-rs-windows-x86_64.zip
          sbom-path: dist/skills-hub-rs-sbom.cdx.json

      - name: Attest desktop Rust dependency SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/skills-hub-rs-desktop-linux-x86_64.deb
            dist/skills-hub-rs-desktop-linux-x86_64.AppImage
            dist/skills-hub-rs-desktop-windows-x86_64-setup.exe
            dist/skills-hub-rs-desktop-windows-x86_64.msi
          sbom-path: dist/skills-hub-rs-desktop-sbom.cdx.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}

        shell: bash
        run: |
          set -euxo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then

            gh release upload \
              "$TAG" \
              dist/* \
              --clobber

          else

            EXTRA_FLAGS=()

            if [[ "$TAG" == *-* ]]; then
              EXTRA_FLAGS+=(--prerelease)
            fi

            gh release create \
              "$TAG" \
              dist/* \
              --verify-tag \
              --generate-notes \
              --title "Skills Hub Rust $TAG" \
              "${EXTRA_FLAGS[@]}"
          fi
