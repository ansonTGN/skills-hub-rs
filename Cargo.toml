[package]
name = "skills-hub-rs"
version = "0.2.0-alpha.2"
edition = "2021"
description = "Rust-native manager for Agent Skills: install once, sync everywhere"
license = "MIT"
repository = "https://github.com/ansonTGN/skills-hub-rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.12"
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.12"
